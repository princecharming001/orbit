name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the Edge Function bundles (supabase/functions/<fn>/dist) are committed; fail when one is out of date
      - name: Edge Function bundles are current
        run: |
          pnpm build:functions
          git diff --exit-code supabase/functions
          test -z "$(git status --porcelain --untracked-files=all supabase/functions)"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (base path = /<repo>/)
        run: pnpm build
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
          # Orbit's shared Claude access for visitors without their own key (supabase/functions/orbit-claude)
          VITE_ORBIT_CLAUDE_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-claude
          # live LinkedIn (Unipile) and warm intros (Village) through supabase/functions/orbit-connectors; each turns
          # on when its key is set as a function secret, and answers "unconfigured" (the app falls back) until then
          VITE_ORBIT_LINKEDIN_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-connectors
          VITE_ORBIT_VILLAGE_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-connectors
          # Google sign-in for Gmail and Calendar: a public OAuth client id, set as the repository variable
          # VITE_GOOGLE_CLIENT_ID (Settings > Secrets and variables > Actions > Variables). Empty until then, and the app
          # hides the Gmail step and never asks students to connect it.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Account mode (server sign-in, sync and the networking agent, plan 16) turns on when the repository variable
          # VITE_ORBIT_API is set to https://<ref>.supabase.co/functions/v1/orbit-api, after Orbit's Google OAuth client
          # is configured (plan 16 §21 H2). Empty until then, and the app runs in local mode as before.
          VITE_ORBIT_API: ${{ vars.VITE_ORBIT_API }}
      - name: Install Playwright browsers
        run: pnpm --filter @orbit/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @orbit/web exec playwright test --project=app
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/web/test-results
          retention-days: 7
      # Frame times depend on the machine, so on shared CI runners they are measured and reported but do not block
      # the deploy. Run `pnpm e2e` locally for the enforced limits.
      - name: Map frame times (reported)
        continue-on-error: true
        run: pnpm --filter @orbit/web exec playwright test --project=perf --no-deps
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
