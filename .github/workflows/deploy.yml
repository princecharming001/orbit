name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (base path = /<repo>/)
        run: pnpm build
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
      - name: Install Playwright browsers
        run: pnpm --filter @orbit/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @orbit/web exec playwright test --project=app
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
      # Frame times depend on the machine, so on shared CI runners they are measured and reported but do not block
      # the deploy. Run `pnpm e2e` locally for the enforced limits.
      - name: Map frame times (reported)
        continue-on-error: true
        run: pnpm --filter @orbit/web exec playwright test --project=perf --no-deps
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
