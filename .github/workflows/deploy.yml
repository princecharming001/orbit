name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push includes an older one, so the older push's checks stop rather than queue; only publishing waits its
# turn (see deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint, types, unit tests and the committed Edge Function bundles: one machine, alongside the browser tests
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the Edge Function bundles (supabase/functions/<fn>/dist) are committed; fail when one is out of date
      - name: Edge Function bundles are current
        run: |
          pnpm build:functions
          git diff --exit-code supabase/functions
          test -z "$(git status --porcelain --untracked-files=all supabase/functions)"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # the browser tests, split four ways and run at once: each machine takes a quarter of them, test by test
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the end-to-end tests run on a build without Google sign-in or account mode, the way they run locally: those
      # switch on extra setup steps the tests do not expect. The site itself is built with everything, in build.
      - name: Build for the end-to-end tests
        run: pnpm build
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
          VITE_ORBIT_CLAUDE_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-claude
          VITE_ORBIT_LINKEDIN_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-connectors
          VITE_ORBIT_VILLAGE_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-connectors
      - name: Install Playwright browsers
        run: pnpm --filter @orbit/web exec playwright install --with-deps chromium
      - name: End-to-end tests (part ${{ matrix.shard }} of 4)
        run: pnpm --filter @orbit/web exec playwright test --project=app --fully-parallel --shard=${{ matrix.shard }}/4
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  # Frame times depend on the machine, so on shared CI runners they are measured and reported but never block the
  # deploy. Run `pnpm e2e` locally for the enforced limits.
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for the frame-time check
        run: pnpm build
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/
          VITE_ORBIT_CLAUDE_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-claude
          VITE_ORBIT_LINKEDIN_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-connectors
          VITE_ORBIT_VILLAGE_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-connectors
      - name: Install Playwright browsers
        run: pnpm --filter @orbit/web exec playwright install --with-deps chromium
      - name: Map frame times (reported)
        run: pnpm --filter @orbit/web exec playwright test --project=perf --no-deps
        env:
          ORBIT_BASE: /${{ github.event.repository.name }}/

  # the site, built once every check has passed
  build:
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site is served from its own domain (tryorbit.today) at the root once the repository variable ORBIT_BASE is
      # set to "/"; without it, from the GitHub Pages address under /<repo>/.
      - name: Build the site
        run: pnpm build
        env:
          ORBIT_BASE: ${{ vars.ORBIT_BASE || format('/{0}/', github.event.repository.name) }}
          # Orbit's shared Claude access for visitors without their own key (supabase/functions/orbit-claude)
          VITE_ORBIT_CLAUDE_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-claude
          # live LinkedIn (Unipile) and warm intros (Village) through supabase/functions/orbit-connectors; each turns
          # on when its key is set as a function secret, and answers "unconfigured" (the app falls back) until then
          VITE_ORBIT_LINKEDIN_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-connectors
          VITE_ORBIT_VILLAGE_PROXY: https://nxibeiykcgxpbmkeadth.supabase.co/functions/v1/orbit-connectors
          # Google sign-in for Gmail and Calendar: a public OAuth client id, set as the repository variable
          # VITE_GOOGLE_CLIENT_ID (Settings > Secrets and variables > Actions > Variables). Empty until then, and the app
          # hides the Gmail step and never asks students to connect it.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Account mode (server sign-in, sync and the networking agent, plan 16) turns on when the repository variable
          # VITE_ORBIT_API is set to https://<ref>.supabase.co/functions/v1/orbit-api, after Orbit's Google OAuth client
          # is configured (plan 16 §21 H2). Empty until then, and the app runs in local mode as before.
          VITE_ORBIT_API: ${{ vars.VITE_ORBIT_API }}
      # Pages replaces the whole site on a deploy: the live site's files come along, so a tab opened before this deploy
      # still loads the parts it asks for later (best effort; scripts/keep-previous-assets.mjs)
      - name: Keep the live site's files for open tabs
        if: vars.ORBIT_BASE == '/'
        run: node scripts/keep-previous-assets.mjs https://tryorbit.today/ apps/web/dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # one publish at a time; the checks before it run in parallel
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
